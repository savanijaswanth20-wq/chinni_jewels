services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chinni_jewels_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app/backend
      - ./assets:/app/assets
      - ./css:/app/css
      - ./js:/app/js
      - ./index.html:/app/index.html
      - ./admin.html:/app/admin.html
      - ./checkout.html:/app/checkout.html
      - ./product.html:/app/product.html
      - ./stock.html:/app/stock.html
      - ./success.html:/app/success.html
    restart: unless-stopped
